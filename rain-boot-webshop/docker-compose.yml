# Listan över containrar som ska startas
services:
# Container nr 1, heter db
  db:
  # Använder en färdig MySQL-image
    image: mysql:8.4
    # Inställningar till MySQL
    environment:
    # root-lösenordet (hämtas från .env)
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      # Skapa databasen rain_boot_webshop
      MYSQL_DATABASE: rain_boot_webshop
      # Sparar datan i volymen db-data, så den överlever omstart
    volumes:
      - db-data:/var/lib/mysql
# Container nr 2
  backend:
  # Bygg från Dockerfilen i den här mappen
    build: .
    # Serverns port 8080 → containerns port 8080
    ports:
      - "8080:8080"
      # Läs in nycklarna från env-filen
    env_file:
      - .env
      # Skriv över databasinställningarna
    environment:
    # Prata med db istället för localhost
      spring.datasource.url: jdbc:mysql://db:3306/rain_boot_webshop
      spring.datasource.username: root
      spring.datasource.password: ${DB_PASSWORD}
      # Starta db först
    depends_on:
      - db
      # Starta om backenden om den kraschar
    restart: on-failure
# Skapa volymen som databasen sparar i
volumes:
  db-data: