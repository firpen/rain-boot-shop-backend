services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: rain_boot_webshop
    volumes:
      - db-data:/var/lib/mysql

  backend:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      spring.datasource.url: jdbc:mysql://db:3306/rain_boot_webshop
      spring.datasource.username: root
      spring.datasource.password: ${DB_PASSWORD}
    depends_on:
      - db
    restart: on-failure

volumes:
  db-data: