spring.application.name=rain-boot-webshop
spring.config.import=optional:file:.env[.properties]

openai.model=gpt-4o
openai.url=https://api.openai.com/v1/chat/completions
frontend.url=http://localhost:4200

spring.datasource.url=jdbc:mysql://localhost:3306/rain_boot_webshop?createDatabaseIfNotExist=true

spring.jpa.hibernate.ddl-auto=update

# https://www.baeldung.com/spring-boot-data-sql-and-schema-sql
# Makes Spring wait with running data.sql until Hibernate has created our tables in the database.
spring.jpa.defer-datasource-initialization=true
# Makes Spring run the data.sql script on every restart
spring.sql.init.mode=always